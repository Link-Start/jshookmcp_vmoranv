name: Publish Packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# SLSA Phase 1 (npm publish auth):
#   - Registry AUTH is done with TRUSTED PUBLISHING (OIDC). There is no
#     long-lived npm token anywhere in this workflow. `id-token: write` lets
#     GitHub mint an OIDC token, and npm >= 11.5.1 exchanges it with the
#     registry for a short-lived credential scoped to this workflow. npm's
#     docs, verbatim: "The npm CLI automatically detects OIDC environments and
#     uses them for authentication before falling back to traditional tokens."
#   - `id-token: write` is ALSO what `npm publish --provenance` needs in order
#     to mint a Sigstore Fulcio signing certificate. Those are two INDEPENDENT
#     consumers of the same OIDC token: provenance has worked since npm 9.5,
#     so a "Signed provenance statement" line in the log is NOT evidence that
#     registry auth succeeded — do not read it as one.
#   - `contents: read` stays for checkout/tag validation.
#   - Both jobs below inherit this block — no per-job override needed.
#
# Trusted Publisher — state verified 2026-10-09 by reading the live npmjs.com
#   settings pages over CDP (Chrome 154.0.8037.98, DevTools port 9308):
#     - @jshookmcp/jshook         -> NO connection yet. The creation form was
#                                    filled and left un-submitted; a connection
#                                    is still REQUIRED before this workflow can
#                                    authenticate.
#     - @jshookmcp/extension-sdk  -> connection EXISTS, status "Pending
#                                    validation". It was created by mistake on
#                                    the wrong package page; harmless, it will
#                                    simply expire unused.
#   Values — IDENTICAL for both packages, but each package needs its OWN
#   connection (a connection is scoped to a single package):
#     Publisher            : GitHub Actions
#     Organization or user : vmoranv
#     Repository           : jshookmcp
#     Workflow filename    : publish-packages.yml
#     Environment name     : (leave blank — no job declares `environment:`)
#
#   ⚠️ "Allowed actions" DIFFERS BY PACKAGE, and getting it wrong fails in
#     opposite directions. Measured 2026-10-09: both boxes ("Allow npm publish",
#     "Allow npm dist-tag") render UNCHECKED, and npm's copy says "npm stage
#     publish is always allowed".
#       - @jshookmcp/jshook  is DUAL-USE -> leave BOTH unchecked. A stage-only
#         publisher is exactly what the dual-use policy requires, and ticking
#         "Allow npm publish" would grant a permission the policy forbids using
#         (see "DUAL-USE" below).
#       - @jshookmcp/extension-sdk is NOT dual-use -> tick "Allow npm publish",
#         otherwise its direct `npm publish` below is rejected.
#
#   ⚠️ A newly created trusted publisher must complete its FIRST successful
#     publish within 2 days. Miss that window and the configuration expires and
#     can no longer be used or edited — it has to be deleted and recreated.
#     npm's docs are explicit about this.
#
#   "Publishing access" needs NO change, despite the two packages differing
#     (measured 2026-10-09):
#       @jshookmcp/jshook        = "Require two-factor authentication and
#                                   disallow bypass 2fa tokens (recommended)"
#       @jshookmcp/extension-sdk = "Require two-factor authentication or a
#                                   granular access token with bypass 2fa
#                                   enabled"
#     npm's page states verbatim: "All publishing access options above are
#     compatible with OIDC trusted publishers. If you have configured trusted
#     publishers for this package, they will continue to work regardless of
#     which option you select." So neither setting blocks this workflow.
#
# ⚠️⚠️ DUAL-USE CONTENT — THE ACTUAL REASON 0.4.0 NEVER SHIPPED.
#   Read this before touching either publish step.
#
#   @jshookmcp/jshook is a *dual-use* package. npm's Dual-Use Content Policy
#   (https://docs.npmjs.com/policies/dual-use, effective 2026-07-28) defines
#   dual-use content as "security-relevant capabilities that can resemble
#   malicious software to automated scanning" and names "penetration-testing
#   tools, security research utilities, code-obfuscation tools" as examples.
#   This package's own keywords read like that list: anti-detection, captcha,
#   deobfuscation, hook, hooking, obfuscation, security-analysis.
#
#   Since 2026-07-28 npm scans every package AT PUBLISH TIME and may publish it
#   "as normal, held for manual review, or blocked". A dual-use package that
#   does NOT declare itself "is blocked by default".
#
#   That is what happened to 0.4.0. Its row on the npm versions page reads:
#       Version   Status    Published
#       0.4.0     Blocked   -
#   and the page explains: "Blocked: The version cannot be installed because it
#   failed automated review. Submit an appeal." The registry has no 0.4.0 at
#   all (absent from `versions`, absent from `time`, HTTP 404), and the Staged
#   Packages page is empty — so this is a BLOCK, not a pending stage.
#
#   ⚠️ This also explains the 2026-10-07 "silent success" below. The upload was
#   accepted and the job exited 0; the block happened afterwards, asynchronously,
#   during scanning. A green publish job was never evidence of a release.
#
#   What the policy REQUIRES of this package — all three are done in-repo:
#     1. `package.json` carries "contentPolicy": { "class": "dual-use" }.
#     2. A DISCLOSURE file sits at the tarball root (and is listed in `files`,
#        without which it would not be packed) describing the dual-use
#        capabilities and their legitimate use. Verified in the tarball with
#        `npm pack --dry-run --ignore-scripts`.
#     3. The declaration is PERSISTENT: "New versions of the Package may not
#        remove the contentPolicy field or the DISCLOSURE file. Publishes that
#        remove them may be rejected."
#     4. Beyond the declaration, the published surface is kept free of the two
#        things automated review blocks on most readily. CI asserts both in the
#        "Verify no install-time script or injection helper ships" step:
#          - NO install-time lifecycle script (`preinstall` / `install` /
#            `postinstall` / `prepare`). A `postinstall` used to run
#            `scripts/postinstall.cjs`, which was a no-op for every consumer yet
#            read to a scanner as exactly an install-time payload. The logic
#            moved to the dev-only `hooks:install` script, which no lifecycle
#            event invokes, and the file left `files`.
#          - NO injection helper. `src/native/scripts/windows/inject-dll.ps1`
#            declared the canonical injection API chain
#            (OpenProcess / VirtualAllocEx / WriteProcessMemory /
#            CreateRemoteThread) without ever calling it, and was reachable only
#            from `ProcessManager.injectDll`, which always returned false. Both
#            the file and the `-ExecutionPolicy Bypass` shell call that
#            referenced it were deleted; the public contract is unchanged.
#
#   ⚠️⚠️ THE PUBLISH METHOD IS CONSTRAINED, AND THIS IS COUNTER-INTUITIVE.
#   The policy lists two methods as NOT PERMITTED:
#       - "Direct publishing with a granular access token that bypasses
#          two-factor authentication."
#       - "Direct publishing via trusted publishing (OIDC). Trusted publishing
#          is permitted for dual-use packages only when staging a package for
#          publishing, not as a direct publish."
#   Verbatim summary: "a dual-use package may be published directly only through
#   an interactive, two-factor-authenticated session. All other methods —
#   including trusted publishing and bypass-2FA tokens — must go through staged
#   publishing."
#
#   So OIDC is still the right credential, but it may only be used to STAGE.
#   The root job below therefore runs `npm stage publish`, and a maintainer
#   promotes it with 2FA:
#       npm stage list @jshookmcp/jshook
#       npm stage approve <stage-id> --otp <code>
#   Do NOT "fix" the root job back to a direct `npm publish`. It is not a
#   configuration problem — a direct OIDC publish of this package is a policy
#   violation and will be rejected.
#
#   @jshookmcp/extension-sdk is NOT dual-use (it is a builder API for plugins
#   and workflows, with no security-relevant capability of its own), declares
#   nothing, and therefore keeps a plain direct `npm publish`.
#
# ⚠️ WHY THIS IS NO LONGER TOKEN-AUTHENTICATED — changed 2026-10-09.
#   The previous revision authenticated with `secrets.NPM_TOKEN`, a granular
#   access token with "bypass 2FA" enabled, which was npm's documented CI/CD
#   pattern at the time. That path is being removed:
#     - bypass-2FA tokens already lost account/package-management actions
#       (2026-07-31 changelog, "Restricting npm bypass-2FA granular access
#       tokens");
#     - they lose DIRECT PUBLISH in January 2027, keeping only "read private
#       packages" and "stage a publish";
#     - npm's own recommendation is verbatim: "You should move automated
#       publishing to trusted publishing (OIDC) or staged publishing."
#   Account 2FA was enabled on 2026-10-09, which is what made the switch
#   possible at all: managing trusted-publisher configuration is a 2FA-gated
#   operation and used to answer E403 "Please enable 2fa for your account".
#
#   ⚠️ Assume `secrets.NPM_TOKEN` IS DEAD. Enabling 2FA invalidated the
#   developer's granular token: it still authenticated on 2026-10-08 (a local
#   `npm publish` got E403 — i.e. the credential was recognised, it just
#   lacked bypass-2FA), and by 2026-10-09 every command answered
#   E401 "your authentication token seems to be invalid", verified against the
#   registry directly with curl, both direct and through the proxy. Do not
#   reintroduce the token as a fallback without re-verifying it first — a dead
#   fallback turns a clean OIDC failure into a confusing one.
#
# ⚠️ THE npm CLI VERSION MATTERS — and it is not the Node version.
#   npm's docs ("Trusted publishing for npm packages") state the requirement
#   verbatim: "Trusted publishing requires npm CLI version 11.5.1 or later and
#   Node version 22.14.0 or higher." Node 24 is NOT required. Node 22 is fine.
#   What breaks the OIDC exchange is that Node 22 ships npm 10.x
#   (v22.14.0 -> npm 10.9.2, v22.23.3 -> npm 10.9.9) and npm 10 knows nothing
#   about OIDC. So each job upgrades the CLI in place (see "Upgrade npm CLI")
#   rather than bumping the Node major.
#   Version floors that matter: >= 11.5.1 for the registry OIDC exchange,
#   >= 11.15.0 for `npm stage` (used by the staged-version checks below),
#   >= 11.21.0 / >= 12.2.0 for OIDC dist-tag management.
#   Pinning npm@12 satisfies all three at once.
#
#   What getting this wrong actually looks like, observed on 2026-10-07
#   (run 37567954332): npm 10 silently fell back to the static NPM_TOKEN, the
#   registry accepted the upload into the STAGING AREA and exited 0 with
#   "Your package is being processed and may take a few minutes to become
#   available", the job went green, and the version never reached the registry.
#   Every later attempt then dies with E409 "Cannot publish over previously
#   staged version". A green publish job is not evidence that a release
#   happened — only the registry is.
#
# ⚠️ STAGED PUBLISHING — read before debugging a "successful" publish.
#   For @jshookmcp/jshook, staging is now INTENTIONAL, not a fallback: the
#   dual-use policy requires it (see the DUAL-USE section above). For
#   @jshookmcp/extension-sdk it remains an accident mode.
#
#   Accident mode looks like this: if the publishing credential cannot satisfy
#   the account's 2FA requirement, npm does not fail — it uploads the tarball to
#   the *staging area* and exits 0 ("Your package is being processed and may take
#   a few minutes to become available"). Nothing appears on the registry.
#
#   Either way, a maintainer promotes a staged version with 2FA:
#       npm stage list @jshookmcp/jshook
#       npm stage approve <stage-id> --otp <code>
#   (or npmjs.com -> package page -> Staged Packages tab)
#
#   Two properties of the staging area worth knowing when debugging:
#     - A version can never be BOTH staged and published — they share one semver
#       uniqueness index. So "already staged" and "already published" are
#       mutually exclusive, and re-staging a staged version is an E409.
#     - A staged version's tag is immutable. To change the tag you must
#       `npm stage reject` and stage again.
#   Until then, every re-run of this workflow dies with
#   E409 "Cannot publish over previously staged version".
#
#   ⚠️⚠️ `npm stage list` CAN LIE — an empty list is not proof of an empty
#   staging area. Verified 2026-10-08: the registry was returning E409
#   "Cannot publish over previously staged version 0.4.0", yet
#   `npm stage list @jshookmcp/jshook` answered HTTP 200 with `[]` — both on
#   this runner and on a developer machine, both with and without --json, and
#   with the same token the publish used. The listing is filtered by what the
#   presented credential is allowed to act on, and a token cannot satisfy the
#   account's 2FA requirement. Related: `npm trust list <pkg>` returns
#   E403 "Please enable 2fa for your account" here, because managing
#   trusted-publishing configuration is a 2FA-gated operation.
#   Therefore: the authoritative "is it already staged?" detector is the
#   publish attempt itself (its E409 branch), NOT the pre-flight stage list,
#   and the only real proof of a release is the registry poll at the end.
#
#   ⚠️ THE 0.4.0 "STAGING DEADLOCK" — IT WAS NEVER A STAGING PROBLEM.
#   KEEP THE HISTORY, BUT READ THE CORRECTION.
#
#   What we believed: from 2026-10-07 to 2026-10-09 a 0.4.0 upload sat in the
#   staging area and nothing could move it, because approving or clearing a
#   staged version needs an interactive 2FA challenge and 2FA was disabled on
#   the account (`npm profile get` -> "two-factor auth: disabled"). That is why
#   the staging notes below read the way they do.
#
#   ⚠️ CORRECTION, verified 2026-10-09: 0.4.0 is NOT staged — it is BLOCKED.
#   The npm versions page shows "0.4.0  Blocked  -" and explains "failed
#   automated review"; the Staged Packages page is empty; the registry has no
#   0.4.0 at all. The "deadlock" was the dual-use block described at the top of
#   this file, misread as a staging problem. 0.4.0 is therefore retired and the
#   version has been bumped to 0.4.1. Do NOT try to "unstick" 0.4.0.
#
#   2FA is now ENABLED, so `npm stage list` / `npm stage approve` /
#   `npm stage reject` work — and for this package they are now the ONLY way to
#   publish, per the dual-use policy.
#
#   Registry policy that still applies, verbatim (npm docs: Requiring 2FA for
#   package publishing and settings modification):
#     "All packages now require two-factor authentication (2FA) or a granular
#      access tokens with bypass 2FA enabled for creating and publishing
#      packages."
#   OIDC satisfies that without any token existing. A granular token WITHOUT
#   bypass-2FA gets a hard E403 — verified locally on 2026-10-08:
#     403 Forbidden - PUT .../@jshookmcp%2fjshook - Two-factor authentication or
#     granular access token with bypass 2fa enabled is required to publish.
#   Staged versions share the published semver index but are invisible to
#   `npm view`, which is why the publish-status steps below check three states
#   (published / staged / absent) instead of two — and why a "staged" answer
#   from `npm stage list` must not be trusted as final.
permissions:
  contents: read
  id-token: write

jobs:
  publish-root:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          scope: '@jshookmcp'
          package-manager-cache: false

      # Node 22 ships npm 10.x, and npm 10 cannot perform the registry-side OIDC
      # exchange for Trusted Publishing (needs >= 11.5.1). It silently falls
      # back to the static token and the upload lands in the staging area with
      # exit 0. Upgrade the CLI, NOT the Node major: the requirement is
      # npm >= 11.5.1 on Node >= 22.14.0 — Node 24 is not required.
      # npm@12 also covers `npm stage` (>= 11.15.0) and OIDC dist-tag
      # management (>= 12.2.0), so one pin satisfies every floor.
      - name: Upgrade npm CLI
        run: |
          npm install -g npm@12
          NPM_VERSION="$(npm --version)"
          echo "npm CLI in use: $NPM_VERSION"
          # The version compare lives in awk rather than in a single-quoted
          # node -e program on purpose: shellcheck reports SC2016 for backticks
          # inside single quotes, and actionlint fails the Repo Hygiene job on
          # any shellcheck finding. The awk program below contains neither $ nor
          # a backtick, so there is nothing for shellcheck to misread.
          if ! awk -v v="$NPM_VERSION" 'BEGIN { split(v, a, "."); ok = (a[1] > 11) || (a[1] == 11 && a[2] >= 21); exit(ok ? 0 : 1) }'; then
            echo "::error title=npm CLI below the floor::npm $NPM_VERSION is below the floor this workflow relies on (>= 11.21.0). Registry OIDC needs >= 11.5.1, npm stage needs >= 11.15.0, and OIDC dist-tag management needs >= 11.21.0. A publish from this runner would fall back to a static token and be silently staged instead of released. The npm install -g npm@12 above did not take effect - check that it succeeded."
            exit 1
          fi
          # The OIDC environment is what npm >= 11.5.1 looks for. If it is
          # missing, `id-token: write` was dropped from the workflow permissions
          # and the publish would fall back to a static token (or die ENEEDAUTH).
          # Asserting it here turns a silent-staging failure that only surfaces
          # after the 5-minute registry poll into an immediate, self-explaining
          # one.
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error title=OIDC environment missing::ACTIONS_ID_TOKEN_REQUEST_URL is not set, so npm cannot mint an OIDC token. Check that the workflow-level 'permissions: id-token: write' block is still present."
            exit 1
          fi
          echo "OIDC request URL present; npm can attempt the Trusted Publisher exchange."

      - name: Enable Corepack pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate registry index
        run: node scripts/generate-domains-index.mjs

      - name: Verify
        run: pnpm run check

      - name: Check root package publish status
        id: root_publish_status
        run: |
          ROOT_VERSION="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          echo "version=$ROOT_VERSION" >> "$GITHUB_OUTPUT"

          # `npm view` reads the public registry, so it needs no credential and
          # is unaffected by the switch to OIDC.
          if npm view "@jshookmcp/jshook@$ROOT_VERSION" version >/dev/null 2>&1; then
            echo "state=published" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Three states, not two. A version that is *staged* (uploaded but
          # awaiting a maintainer's 2FA approval) is invisible to `npm view`,
          # so a binary published/not-published check reports "not published"
          # and every re-run retries the publish until it dies with
          # E409 "Cannot publish over previously staged version".
          #
          # ⚠️ This listing is a HINT, never a verdict, and it is deliberately
          # best-effort:
          #   - It was proven unreliable under the old token auth. On
          #     2026-10-08 the registry was answering E409 for 0.4.0 while
          #     `npm stage list` returned HTTP 200 with `[]` — on this runner
          #     and on a developer machine, with and without --json, using the
          #     very same credential the publish used. The listing is filtered
          #     by what the presented credential may act on.
          #   - Its behaviour under OIDC is UNVERIFIED. The trusted-publisher
          #     permission model guarantees `npm stage publish`; the docs say
          #     nothing about listing.
          #   So a failure or an empty answer here is reported and then ignored
          #   rather than treated as fatal. The authoritative detectors are the
          #   publish attempt (its E409 branch) and the registry poll at the end.
          STAGED="$(npm stage list "@jshookmcp/jshook" --json 2>"$RUNNER_TEMP/stage-list.err")" || {
            echo "::warning title=Staged-state check inconclusive::'npm stage list' failed, so this workflow cannot tell whether @jshookmcp/jshook@$ROOT_VERSION is already staged. Continuing anyway — the publish attempt below is the authoritative detector. Output was:"
            cat "$RUNNER_TEMP/stage-list.err"
            STAGED=""
          }
          if [ -n "$STAGED" ] && printf '%s' "$STAGED" | grep -qF "$ROOT_VERSION"; then
            echo "state=staged" >> "$GITHUB_OUTPUT"
          else
            echo "state=absent" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail loudly on an unapproved staged version
        if: steps.root_publish_status.outputs.state == 'staged'
        env:
          VERSION: ${{ steps.root_publish_status.outputs.version }}
        run: |
          echo "::error title=Staged version awaiting approval::@jshookmcp/jshook@$VERSION is already in the npm staging area. It will never go live until a maintainer approves it with 2FA. Publishing again returns E409."
          # Print the real stage list so the approval can be run straight from
          # the summary — the stage-id is what the approve command needs.
          STAGE_LIST="$(npm stage list "@jshookmcp/jshook" 2>&1)"
          echo "$STAGE_LIST"
          {
            echo "### @jshookmcp/jshook@$VERSION is staged, not published"
            echo
            echo "A previous publish uploaded this version to npm's staging area. Until a maintainer approves it, the registry keeps serving the last live version and every publish attempt returns E409."
            echo
            echo "Approve it, then re-run this workflow:"
            echo
            echo '```bash'
            echo "npm stage approve <stage-id>"
            echo '```'
            echo
            echo "Or approve on npmjs.com -> the package page -> **Staged Packages** tab."
            echo
            echo "Staged versions visible to this workflow's credential:"
            echo
            echo '```'
            echo "$STAGE_LIST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Pack and verify root package
        if: steps.root_publish_status.outputs.state == 'absent'
        run: pnpm run package:verify-release

      # Guard the declaration itself. npm's Dual-Use Content Policy requires
      # BOTH the `contentPolicy` field and a `DISCLOSURE` file in the PUBLISHED
      # tarball, and states the declaration must persist across versions —
      # publishes that drop them "may be rejected". Both are easy to lose by
      # accident: `DISCLOSURE` only ships because it is listed in
      # package.json -> files, and a tidy-up could remove either one. Losing
      # them silently would mean another blocked release, so fail here instead.
      - name: Verify dual-use metadata is in the tarball
        if: steps.root_publish_status.outputs.state == 'absent'
        run: |
          TARBALL="$(find .release-artifacts -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$TARBALL"

          if ! tar -tzf "$TARBALL" | grep -qx 'package/DISCLOSURE'; then
            echo "::error title=DISCLOSURE missing from tarball::The published package must contain a DISCLOSURE file at its root (npm Dual-Use Content Policy). It is packed only because package.json -> files lists it. Tarball contents were:"
            tar -tzf "$TARBALL" | head -40
            exit 1
          fi

          POLICY="$(tar -xzOf "$TARBALL" package/package.json | node -p 'JSON.parse(require("node:fs").readFileSync(0,"utf8")).contentPolicy?.class ?? ""')"
          if [ "$POLICY" != "dual-use" ]; then
            echo "::error title=contentPolicy missing or wrong::package.json inside the tarball must declare contentPolicy.class = dual-use (got: $POLICY). Dropping the declaration from a package that has already published with it may cause the publish to be rejected."
            exit 1
          fi

          echo "Dual-use declaration present: DISCLOSURE + contentPolicy.class=dual-use"

      # The published package must contain NO install-time lifecycle script and NO
      # injection helper. Both were removed deliberately (2026-10-09) to get past
      # npm's publish-time automated review:
      #   - `postinstall` ran `scripts/postinstall.cjs`. That script was a no-op
      #     for every consumer (it exited 0 unless it could see a dev checkout —
      #     `.git` / `src/index.ts` / `tsconfig.json`, none of which are
      #     published), yet a `postinstall` key reads to a scanner as exactly an
      #     install-time payload. The logic moved to the dev-only `hooks:install`
      #     script, which no lifecycle event invokes.
      #   - `inject-dll.ps1` declared the canonical injection API chain
      #     (OpenProcess / VirtualAllocEx / WriteProcessMemory /
      #     CreateRemoteThread) without ever calling any of it, and was reachable
      #     only from `ProcessManager.injectDll`, which always returned false.
      # A dependency bump, a `files` tidy-up or a revert could reintroduce either
      # and silently earn another Blocked verdict. Fail loudly instead.
      - name: Verify no install-time script or injection helper ships
        if: steps.root_publish_status.outputs.state == 'absent'
        run: |
          TARBALL="$(find .release-artifacts -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$TARBALL"

          HOOKS="$(tar -xzOf "$TARBALL" package/package.json | node -p '
            const s = JSON.parse(require("node:fs").readFileSync(0, "utf8")).scripts ?? {};
            ["preinstall", "install", "postinstall", "prepare"].filter((k) => k in s).join(", ")
          ')"
          if [ -n "$HOOKS" ]; then
            echo "::error title=Install-time lifecycle script in the published package::package.json inside the tarball declares: $HOOKS. For a dual-use package, executing code at install time is a blocking signal for npm's automated review. Put the logic in a dev-only script (see the 'hooks:install' entry) rather than a lifecycle hook, and keep it out of package.json -> files."
            exit 1
          fi

          if tar -tzf "$TARBALL" | grep -qi 'inject-dll'; then
            echo "::error title=Injection helper shipped in the tarball::The tarball contains an 'inject-dll' file. This was removed deliberately - it declared an injection API chain it never called, and the filename alone reads as malware to automated review. Matching entries:"
            tar -tzf "$TARBALL" | grep -i 'inject-dll'
            exit 1
          fi

          echo "Clean: no install-time lifecycle script, no injection helper"

      - name: Publish root package
        if: steps.root_publish_status.outputs.state == 'absent'
        run: |
          ROOT_TARBALL="$(find .release-artifacts -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$ROOT_TARBALL"
          # `--provenance` enables npm SLSA Build L1 attestation via Sigstore
          # Fulcio. Requires `id-token: write` (set at workflow level above).
          #
          # AUTH: OIDC, and nothing else. No NODE_AUTH_TOKEN is set on this step
          # on purpose — npm >= 11.5.1 detects the OIDC environment and performs
          # the registry-side Trusted Publisher exchange. Setting a token here
          # would re-introduce the long-lived credential this workflow exists to
          # remove, and would silently mask a broken OIDC setup as a working one.
          #
          # ⚠️ `npm stage publish`, NOT `npm publish`.
          # @jshookmcp/jshook is dual-use, and npm's policy forbids direct
          # publishing via trusted publishing (OIDC) for dual-use packages —
          # OIDC may only STAGE. See the DUAL-USE section in the header. Staging
          # is also always permitted by a trusted publisher regardless of what
          # "Allowed actions" says.
          #
          # `npm` is used rather than `pnpm` because pnpm's implementation does
          # not perform the registry OIDC exchange and fails ENEEDAUTH on a
          # token-less runner.
          #
          # `npm stage publish` never prompts for 2FA (that is the point of
          # staging); `npm stage approve` is where 2FA is enforced.
          #
          # Staging is the EXPECTED outcome, so a zero exit code here means
          # "staged", not "live". The E409 case is still turned into an explicit
          # error, because re-staging an already-staged version is a genuine
          # mistake that would otherwise look like a green run.
          LOG="$RUNNER_TEMP/npm-stage-publish.log"
          set +e
          npm stage publish "$ROOT_TARBALL" --provenance --access public 2>&1 | tee "$LOG"
          PUBLISH_STATUS="${PIPESTATUS[0]}"
          set -e
          if [ "$PUBLISH_STATUS" -ne 0 ]; then
            if grep -qF 'previously staged version' "$LOG"; then
              echo "::error title=Version already staged::Staging was rejected because @jshookmcp/jshook@${{ steps.root_publish_status.outputs.version }} already exists in the npm staging area. A maintainer must approve or reject it with 2FA (npm stage list @jshookmcp/jshook, then npm stage approve or reject <stage-id>, or the Staged Packages tab on npmjs.com) before this version can be staged again. Note that 'npm stage list' can report an empty staging area even when this E409 is returned — trust the E409, not the listing."
            fi
          fi
          exit "$PUBLISH_STATUS"

      # Staging is the EXPECTED outcome for this package, so the old "poll the
      # registry until the version appears" guard is GONE — a staged version
      # never appears on the registry, so that poll would fail every successful
      # run. What replaces it: report what is staged and tell the maintainer
      # exactly how to promote it.
      #
      # The stage listing is a HINT, not a verdict — it has been observed to
      # print an empty list even when a version is staged — so an empty result
      # is reported, never turned into a failure.
      - name: Report the staged version awaiting approval
        if: steps.root_publish_status.outputs.state == 'absent'
        env:
          VERSION: ${{ steps.root_publish_status.outputs.version }}
        run: |
          # A version can never be BOTH staged and published, and the registry
          # is authoritative for "published". If it somehow went live anyway,
          # say so loudly — that would mean the dual-use constraint was bypassed.
          if npm view "@jshookmcp/jshook@$VERSION" version >/dev/null 2>&1; then
            echo "::warning title=Published directly::@jshookmcp/jshook@$VERSION is already live on the registry. This should not happen for a dual-use package staged via OIDC — verify that DISCLOSURE and contentPolicy are present in the published tarball."
          fi

          echo "### @jshookmcp/jshook@$VERSION has been staged"
          echo
          echo "A maintainer must approve it with 2FA before it goes live:"
          echo
          echo "    npm stage list @jshookmcp/jshook"
          echo "    npm stage approve <stage-id> --otp <code>"
          echo
          echo "Or use the Staged Packages tab on npmjs.com."
          echo
          echo "Staged state as the registry reports it right now:"
          npm stage list "@jshookmcp/jshook" 2>&1 || true
          {
            echo "### Staged: @jshookmcp/jshook@$VERSION"
            echo
            echo "Approve with 2FA to publish:"
            echo
            echo "    npm stage list @jshookmcp/jshook"
            echo "    npm stage approve <stage-id> --otp <code>"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-extension-sdk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          scope: '@jshookmcp'
          package-manager-cache: false

      # Node 22 ships npm 10.x, and npm 10 cannot perform the registry-side OIDC
      # exchange for Trusted Publishing (needs >= 11.5.1). It silently falls
      # back to the static token and the upload lands in the staging area with
      # exit 0. Upgrade the CLI, NOT the Node major: the requirement is
      # npm >= 11.5.1 on Node >= 22.14.0 — Node 24 is not required.
      # npm@12 also covers `npm stage` (>= 11.15.0) and OIDC dist-tag
      # management (>= 12.2.0), so one pin satisfies every floor.
      - name: Upgrade npm CLI
        run: |
          npm install -g npm@12
          NPM_VERSION="$(npm --version)"
          echo "npm CLI in use: $NPM_VERSION"
          # The version compare lives in awk rather than in a single-quoted
          # node -e program on purpose: shellcheck reports SC2016 for backticks
          # inside single quotes, and actionlint fails the Repo Hygiene job on
          # any shellcheck finding. The awk program below contains neither $ nor
          # a backtick, so there is nothing for shellcheck to misread.
          if ! awk -v v="$NPM_VERSION" 'BEGIN { split(v, a, "."); ok = (a[1] > 11) || (a[1] == 11 && a[2] >= 21); exit(ok ? 0 : 1) }'; then
            echo "::error title=npm CLI below the floor::npm $NPM_VERSION is below the floor this workflow relies on (>= 11.21.0). Registry OIDC needs >= 11.5.1, npm stage needs >= 11.15.0, and OIDC dist-tag management needs >= 11.21.0. A publish from this runner would fall back to a static token and be silently staged instead of released. The npm install -g npm@12 above did not take effect - check that it succeeded."
            exit 1
          fi
          # The OIDC environment is what npm >= 11.5.1 looks for. If it is
          # missing, `id-token: write` was dropped from the workflow permissions
          # and the publish would fall back to a static token (or die ENEEDAUTH).
          # Asserting it here turns a silent-staging failure that only surfaces
          # after the 5-minute registry poll into an immediate, self-explaining
          # one.
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error title=OIDC environment missing::ACTIONS_ID_TOKEN_REQUEST_URL is not set, so npm cannot mint an OIDC token. Check that the workflow-level 'permissions: id-token: write' block is still present."
            exit 1
          fi
          echo "OIDC request URL present; npm can attempt the Trusted Publisher exchange."

      - name: Enable Corepack pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate registry index
        run: node scripts/generate-domains-index.mjs

      - name: Verify and build SDK
        run: |
          pnpm -C packages/extension-sdk typecheck
          pnpm -C packages/extension-sdk build

      - name: Check SDK package publish status
        id: sdk_publish_status
        run: |
          SDK_VERSION="$(node -p "JSON.parse(require('node:fs').readFileSync('packages/extension-sdk/package.json', 'utf8')).version")"
          echo "version=$SDK_VERSION" >> "$GITHUB_OUTPUT"

          # Same three-state check as the root package, and the same caveat:
          # the stage listing is a HINT, not a verdict. See the root job for the
          # full rationale — including why an empty `npm stage list` is NOT
          # proof that nothing is staged, why its behaviour under OIDC is
          # unverified, and why the publish attempt is the real detector.
          if npm view "@jshookmcp/extension-sdk@$SDK_VERSION" version >/dev/null 2>&1; then
            echo "state=published" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          STAGED="$(npm stage list "@jshookmcp/extension-sdk" --json 2>"$RUNNER_TEMP/stage-list-sdk.err")" || {
            echo "::warning title=Staged-state check inconclusive::'npm stage list' failed, so this workflow cannot tell whether @jshookmcp/extension-sdk@$SDK_VERSION is already staged. Continuing anyway — the publish attempt below is the authoritative detector. Output was:"
            cat "$RUNNER_TEMP/stage-list-sdk.err"
            STAGED=""
          }
          if [ -n "$STAGED" ] && printf '%s' "$STAGED" | grep -qF "$SDK_VERSION"; then
            echo "state=staged" >> "$GITHUB_OUTPUT"
          else
            echo "state=absent" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail loudly on an unapproved staged SDK version
        if: steps.sdk_publish_status.outputs.state == 'staged'
        env:
          VERSION: ${{ steps.sdk_publish_status.outputs.version }}
        run: |
          echo "::error title=Staged version awaiting approval::@jshookmcp/extension-sdk@$VERSION is already in the npm staging area. It will never go live until a maintainer approves it with 2FA. Publishing again returns E409."
          STAGE_LIST="$(npm stage list "@jshookmcp/extension-sdk" 2>&1)"
          echo "$STAGE_LIST"
          {
            echo "### @jshookmcp/extension-sdk@$VERSION is staged, not published"
            echo
            echo "Approve it, then re-run this workflow:"
            echo
            echo '```bash'
            echo "npm stage approve <stage-id>"
            echo '```'
            echo
            echo "Or approve on npmjs.com -> the package page -> **Staged Packages** tab."
            echo
            echo "Staged versions visible to this workflow's credential:"
            echo
            echo '```'
            echo "$STAGE_LIST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Pack SDK package
        if: steps.sdk_publish_status.outputs.state == 'absent'
        run: |
          rm -rf .release-artifacts-sdk
          mkdir -p .release-artifacts-sdk
          pnpm -C packages/extension-sdk pack --pack-destination ../../.release-artifacts-sdk

      - name: Publish extension SDK
        if: steps.sdk_publish_status.outputs.state == 'absent'
        run: |
          SDK_TARBALL="$(find .release-artifacts-sdk -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$SDK_TARBALL"
          # `--provenance` enables npm SLSA Build L1 attestation via Sigstore
          # Fulcio. Requires `id-token: write` (set at workflow level above).
          # AUTH is OIDC — no NODE_AUTH_TOKEN is set on this step. See the root
          # job's publish step for the full rationale.
          LOG="$RUNNER_TEMP/npm-publish-sdk.log"
          set +e
          npm publish "$SDK_TARBALL" --provenance --access public 2>&1 | tee "$LOG"
          PUBLISH_STATUS="${PIPESTATUS[0]}"
          set -e
          if [ "$PUBLISH_STATUS" -ne 0 ]; then
            if grep -qF 'previously staged version' "$LOG"; then
              echo "::error title=Staged version awaiting approval::Publish was rejected because @jshookmcp/extension-sdk@${{ steps.sdk_publish_status.outputs.version }} already exists in the npm staging area. A maintainer must clear or approve it with 2FA (npm stage list @jshookmcp/extension-sdk, then npm stage approve or reject <stage-id>, or the Staged Packages tab on npmjs.com) before this version can go live. Note that 'npm stage list' can report an empty staging area even when this E409 is returned — trust the E409, not the listing."
            fi
          fi
          exit "$PUBLISH_STATUS"

      # See the root job for why this exists: a publish can exit 0 and still
      # never reach the registry.
      - name: Verify the published SDK version is actually live
        if: steps.sdk_publish_status.outputs.state == 'absent'
        env:
          VERSION: ${{ steps.sdk_publish_status.outputs.version }}
        run: |
          for attempt in $(seq 1 30); do
            if npm view "@jshookmcp/extension-sdk@$VERSION" version >/dev/null 2>&1; then
              echo "@jshookmcp/extension-sdk@$VERSION is live on the registry."
              exit 0
            fi
            echo "Waiting for @jshookmcp/extension-sdk@$VERSION to appear on the registry (${attempt}/30)"
            sleep 10
          done
          echo "::error title=Publish did not go live::npm publish reported success, but @jshookmcp/extension-sdk@$VERSION never appeared on the registry. Two likely causes, in order of probability. (1) It was STAGED, not published: the trusted publisher may be configured for 'npm stage publish' only. Check the Staged Packages tab on npmjs.com, then clear or approve it — 'npm stage list @jshookmcp/extension-sdk', then 'npm stage approve' or 'npm stage reject <stage-id>'. (2) The OIDC exchange silently fell back to a static token: verify the trusted publisher's 'Allowed actions' includes direct publishing, and that its first-publish validation window (2 days from creation) has not expired. Caveat learned the hard way: 'npm stage list' can print an empty list even when a version is staged, so always check the Staged Packages tab as well."
          exit 1
