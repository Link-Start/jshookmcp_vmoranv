name: Publish Packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# SLSA Phase 1 (npm publish auth):
#   - Registry AUTH is done with TRUSTED PUBLISHING (OIDC). There is no
#     long-lived npm token anywhere in this workflow. `id-token: write` lets
#     GitHub mint an OIDC token, and npm >= 11.5.1 exchanges it with the
#     registry for a short-lived credential scoped to this workflow. npm's
#     docs, verbatim: "The npm CLI automatically detects OIDC environments and
#     uses them for authentication before falling back to traditional tokens."
#   - `id-token: write` is ALSO what `npm publish --provenance` needs in order
#     to mint a Sigstore Fulcio signing certificate. Those are two INDEPENDENT
#     consumers of the same OIDC token: provenance has worked since npm 9.5,
#     so a "Signed provenance statement" line in the log is NOT evidence that
#     registry auth succeeded — do not read it as one.
#   - `contents: read` stays for checkout/tag validation.
#   - Both jobs below inherit this block — no per-job override needed.
#
# Trusted Publisher (configured on npmjs.com for both packages):
#   org: vmoranv, repo: jshookmcp, workflow: publish-packages.yml.
#
#   ⚠️ TWO npmjs.com-SIDE REQUIREMENTS THIS WORKFLOW CANNOT CHECK FOR YOU.
#     Both live at: package page -> Settings -> Trusted publishing.
#     1. "Allowed actions" must include DIRECT publishing. `npm stage publish`
#        is always permitted, but direct `npm publish` has to be enabled
#        explicitly, and a configuration created after 2026-09-03 defaults to
#        STAGE ONLY. If it is not enabled the publish below fails even though
#        the OIDC handshake itself succeeded.
#     2. A newly created trusted publisher must complete its FIRST successful
#        publish within 2 days. Miss that window and the configuration expires
#        and can no longer be used or edited — it has to be deleted and
#        recreated. npm's docs are explicit about this.
#
# ⚠️ WHY THIS IS NO LONGER TOKEN-AUTHENTICATED — changed 2026-10-09.
#   The previous revision authenticated with `secrets.NPM_TOKEN`, a granular
#   access token with "bypass 2FA" enabled, which was npm's documented CI/CD
#   pattern at the time. That path is being removed:
#     - bypass-2FA tokens already lost account/package-management actions
#       (2026-07-31 changelog, "Restricting npm bypass-2FA granular access
#       tokens");
#     - they lose DIRECT PUBLISH in January 2027, keeping only "read private
#       packages" and "stage a publish";
#     - npm's own recommendation is verbatim: "You should move automated
#       publishing to trusted publishing (OIDC) or staged publishing."
#   Account 2FA was enabled on 2026-10-09, which is what made the switch
#   possible at all: managing trusted-publisher configuration is a 2FA-gated
#   operation and used to answer E403 "Please enable 2fa for your account".
#
#   ⚠️ Assume `secrets.NPM_TOKEN` IS DEAD. Enabling 2FA invalidated the
#   developer's granular token: it still authenticated on 2026-10-08 (a local
#   `npm publish` got E403 — i.e. the credential was recognised, it just
#   lacked bypass-2FA), and by 2026-10-09 every command answered
#   E401 "your authentication token seems to be invalid", verified against the
#   registry directly with curl, both direct and through the proxy. Do not
#   reintroduce the token as a fallback without re-verifying it first — a dead
#   fallback turns a clean OIDC failure into a confusing one.
#
# ⚠️ THE npm CLI VERSION MATTERS — and it is not the Node version.
#   npm's docs ("Trusted publishing for npm packages") state the requirement
#   verbatim: "Trusted publishing requires npm CLI version 11.5.1 or later and
#   Node version 22.14.0 or higher." Node 24 is NOT required. Node 22 is fine.
#   What breaks the OIDC exchange is that Node 22 ships npm 10.x
#   (v22.14.0 -> npm 10.9.2, v22.23.3 -> npm 10.9.9) and npm 10 knows nothing
#   about OIDC. So each job upgrades the CLI in place (see "Upgrade npm CLI")
#   rather than bumping the Node major.
#   Version floors that matter: >= 11.5.1 for the registry OIDC exchange,
#   >= 11.15.0 for `npm stage` (used by the staged-version checks below),
#   >= 11.21.0 / >= 12.2.0 for OIDC dist-tag management.
#   Pinning npm@12 satisfies all three at once.
#
#   What getting this wrong actually looks like, observed on 2026-10-07
#   (run 37567954332): npm 10 silently fell back to the static NPM_TOKEN, the
#   registry accepted the upload into the STAGING AREA and exited 0 with
#   "Your package is being processed and may take a few minutes to become
#   available", the job went green, and the version never reached the registry.
#   Every later attempt then dies with E409 "Cannot publish over previously
#   staged version". A green publish job is not evidence that a release
#   happened — only the registry is.
#
# ⚠️ STAGED PUBLISHING — read before debugging a "successful" publish.
#   If the publishing credential cannot satisfy the account's 2FA requirement,
#   npm does not fail: it uploads the tarball to the *staging area* and exits 0
#   ("Your package is being processed and may take a few minutes to become
#   available"). Nothing appears on the registry. A maintainer must approve the
#   staged version with 2FA before it goes live:
#       npm stage list @jshookmcp/jshook
#       npm stage approve <stage-id>
#   (or npmjs.com -> package page -> Staged Packages tab)
#   Until then, every re-run of this workflow dies with
#   E409 "Cannot publish over previously staged version".
#
#   ⚠️⚠️ `npm stage list` CAN LIE — an empty list is not proof of an empty
#   staging area. Verified 2026-10-08: the registry was returning E409
#   "Cannot publish over previously staged version 0.4.0", yet
#   `npm stage list @jshookmcp/jshook` answered HTTP 200 with `[]` — both on
#   this runner and on a developer machine, both with and without --json, and
#   with the same token the publish used. The listing is filtered by what the
#   presented credential is allowed to act on, and a token cannot satisfy the
#   account's 2FA requirement. Related: `npm trust list <pkg>` returns
#   E403 "Please enable 2fa for your account" here, because managing
#   trusted-publishing configuration is a 2FA-gated operation.
#   Therefore: the authoritative "is it already staged?" detector is the
#   publish attempt itself (its E409 branch), NOT the pre-flight stage list,
#   and the only real proof of a release is the registry poll at the end.
#
#   ⚠️ THE 0.4.0 STAGING DEADLOCK — RESOLVED 2026-10-09, KEEP THE HISTORY.
#   From 2026-10-07 to 2026-10-09 a 0.4.0 upload sat in the staging area and
#   nothing could move it: approving or clearing a staged version needs an
#   interactive 2FA challenge, and 2FA was disabled on the account
#   (`npm profile get` -> "two-factor auth: disabled"). That is why the
#   staging notes below read the way they do. 2FA is now ENABLED, so
#   `npm stage list` / `npm stage approve` / `npm stage reject` work again —
#   but note the workflow no longer uses them for authentication.
#
#   Registry policy that still applies, verbatim (npm docs: Requiring 2FA for
#   package publishing and settings modification):
#     "All packages now require two-factor authentication (2FA) or a granular
#      access tokens with bypass 2FA enabled for creating and publishing
#      packages."
#   OIDC satisfies that without any token existing. A granular token WITHOUT
#   bypass-2FA gets a hard E403 — verified locally on 2026-10-08:
#     403 Forbidden - PUT .../@jshookmcp%2fjshook - Two-factor authentication or
#     granular access token with bypass 2fa enabled is required to publish.
#   Staged versions share the published semver index but are invisible to
#   `npm view`, which is why the publish-status steps below check three states
#   (published / staged / absent) instead of two — and why a "staged" answer
#   from `npm stage list` must not be trusted as final.
permissions:
  contents: read
  id-token: write

jobs:
  publish-root:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          scope: '@jshookmcp'
          package-manager-cache: false

      # Node 22 ships npm 10.x, and npm 10 cannot perform the registry-side OIDC
      # exchange for Trusted Publishing (needs >= 11.5.1). It silently falls
      # back to the static token and the upload lands in the staging area with
      # exit 0. Upgrade the CLI, NOT the Node major: the requirement is
      # npm >= 11.5.1 on Node >= 22.14.0 — Node 24 is not required.
      # npm@12 also covers `npm stage` (>= 11.15.0) and OIDC dist-tag
      # management (>= 12.2.0), so one pin satisfies every floor.
      - name: Upgrade npm CLI
        run: |
          npm install -g npm@12
          NPM_VERSION="$(npm --version)"
          echo "npm CLI in use: $NPM_VERSION"
          # The version compare lives in awk rather than in a single-quoted
          # node -e program on purpose: shellcheck reports SC2016 for backticks
          # inside single quotes, and actionlint fails the Repo Hygiene job on
          # any shellcheck finding. The awk program below contains neither $ nor
          # a backtick, so there is nothing for shellcheck to misread.
          if ! awk -v v="$NPM_VERSION" 'BEGIN { split(v, a, "."); ok = (a[1] > 11) || (a[1] == 11 && a[2] >= 21); exit(ok ? 0 : 1) }'; then
            echo "::error title=npm CLI below the floor::npm $NPM_VERSION is below the floor this workflow relies on (>= 11.21.0). Registry OIDC needs >= 11.5.1, npm stage needs >= 11.15.0, and OIDC dist-tag management needs >= 11.21.0. A publish from this runner would fall back to a static token and be silently staged instead of released. The npm install -g npm@12 above did not take effect - check that it succeeded."
            exit 1
          fi
          # The OIDC environment is what npm >= 11.5.1 looks for. If it is
          # missing, `id-token: write` was dropped from the workflow permissions
          # and the publish would fall back to a static token (or die ENEEDAUTH).
          # Asserting it here turns a silent-staging failure that only surfaces
          # after the 5-minute registry poll into an immediate, self-explaining
          # one.
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error title=OIDC environment missing::ACTIONS_ID_TOKEN_REQUEST_URL is not set, so npm cannot mint an OIDC token. Check that the workflow-level 'permissions: id-token: write' block is still present."
            exit 1
          fi
          echo "OIDC request URL present; npm can attempt the Trusted Publisher exchange."

      - name: Enable Corepack pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate registry index
        run: node scripts/generate-domains-index.mjs

      - name: Verify
        run: pnpm run check

      - name: Check root package publish status
        id: root_publish_status
        run: |
          ROOT_VERSION="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          echo "version=$ROOT_VERSION" >> "$GITHUB_OUTPUT"

          # `npm view` reads the public registry, so it needs no credential and
          # is unaffected by the switch to OIDC.
          if npm view "@jshookmcp/jshook@$ROOT_VERSION" version >/dev/null 2>&1; then
            echo "state=published" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Three states, not two. A version that is *staged* (uploaded but
          # awaiting a maintainer's 2FA approval) is invisible to `npm view`,
          # so a binary published/not-published check reports "not published"
          # and every re-run retries the publish until it dies with
          # E409 "Cannot publish over previously staged version".
          #
          # ⚠️ This listing is a HINT, never a verdict, and it is deliberately
          # best-effort:
          #   - It was proven unreliable under the old token auth. On
          #     2026-10-08 the registry was answering E409 for 0.4.0 while
          #     `npm stage list` returned HTTP 200 with `[]` — on this runner
          #     and on a developer machine, with and without --json, using the
          #     very same credential the publish used. The listing is filtered
          #     by what the presented credential may act on.
          #   - Its behaviour under OIDC is UNVERIFIED. The trusted-publisher
          #     permission model guarantees `npm stage publish`; the docs say
          #     nothing about listing.
          #   So a failure or an empty answer here is reported and then ignored
          #   rather than treated as fatal. The authoritative detectors are the
          #   publish attempt (its E409 branch) and the registry poll at the end.
          STAGED="$(npm stage list "@jshookmcp/jshook" --json 2>"$RUNNER_TEMP/stage-list.err")" || {
            echo "::warning title=Staged-state check inconclusive::'npm stage list' failed, so this workflow cannot tell whether @jshookmcp/jshook@$ROOT_VERSION is already staged. Continuing anyway — the publish attempt below is the authoritative detector. Output was:"
            cat "$RUNNER_TEMP/stage-list.err"
            STAGED=""
          }
          if [ -n "$STAGED" ] && printf '%s' "$STAGED" | grep -qF "$ROOT_VERSION"; then
            echo "state=staged" >> "$GITHUB_OUTPUT"
          else
            echo "state=absent" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail loudly on an unapproved staged version
        if: steps.root_publish_status.outputs.state == 'staged'
        env:
          VERSION: ${{ steps.root_publish_status.outputs.version }}
        run: |
          echo "::error title=Staged version awaiting approval::@jshookmcp/jshook@$VERSION is already in the npm staging area. It will never go live until a maintainer approves it with 2FA. Publishing again returns E409."
          # Print the real stage list so the approval can be run straight from
          # the summary — the stage-id is what the approve command needs.
          STAGE_LIST="$(npm stage list "@jshookmcp/jshook" 2>&1)"
          echo "$STAGE_LIST"
          {
            echo "### @jshookmcp/jshook@$VERSION is staged, not published"
            echo
            echo "A previous publish uploaded this version to npm's staging area. Until a maintainer approves it, the registry keeps serving the last live version and every publish attempt returns E409."
            echo
            echo "Approve it, then re-run this workflow:"
            echo
            echo '```bash'
            echo "npm stage approve <stage-id>"
            echo '```'
            echo
            echo "Or approve on npmjs.com -> the package page -> **Staged Packages** tab."
            echo
            echo "Staged versions visible to this workflow's credential:"
            echo
            echo '```'
            echo "$STAGE_LIST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Pack and verify root package
        if: steps.root_publish_status.outputs.state == 'absent'
        run: pnpm run package:verify-release

      - name: Publish root package
        if: steps.root_publish_status.outputs.state == 'absent'
        run: |
          ROOT_TARBALL="$(find .release-artifacts -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$ROOT_TARBALL"
          # `--provenance` enables npm SLSA Build L1 attestation via Sigstore
          # Fulcio. Requires `id-token: write` (set at workflow level above).
          #
          # AUTH: OIDC, and nothing else. No NODE_AUTH_TOKEN is set on this step
          # on purpose — npm >= 11.5.1 detects the OIDC environment and performs
          # the registry-side Trusted Publisher exchange. Setting a token here
          # would re-introduce the long-lived credential this workflow exists to
          # remove, and would silently mask a broken OIDC setup as a working one.
          #
          # `npm publish` is used rather than `pnpm publish` because pnpm's
          # implementation does not perform the registry OIDC exchange and
          # fails ENEEDAUTH on a token-less runner.
          #
          # A publish that lands in the staging area still exits 0, so the exit
          # code alone cannot tell "went live" from "needs 2FA approval".
          # Inspect the output and turn the E409 case into an explicit failure
          # with instructions, instead of a green job that changed nothing.
          LOG="$RUNNER_TEMP/npm-publish.log"
          set +e
          npm publish "$ROOT_TARBALL" --provenance --access public 2>&1 | tee "$LOG"
          PUBLISH_STATUS="${PIPESTATUS[0]}"
          set -e
          if [ "$PUBLISH_STATUS" -ne 0 ]; then
            if grep -qF 'previously staged version' "$LOG"; then
              echo "::error title=Staged version awaiting approval::Publish was rejected because @jshookmcp/jshook@${{ steps.root_publish_status.outputs.version }} already exists in the npm staging area. A maintainer must clear or approve it with 2FA (npm stage list @jshookmcp/jshook, then npm stage approve or reject <stage-id>, or the Staged Packages tab on npmjs.com) before this version can go live. Note that 'npm stage list' can report an empty staging area even when this E409 is returned — trust the E409, not the listing."
            fi
          fi
          exit "$PUBLISH_STATUS"

      # The single most important guard in this workflow.
      # On 2026-10-07 a publish exited 0 with the normal success output
      # ("Publishing to https://registry.npmjs.org ... + @jshookmcp/jshook@0.4.0")
      # and the version still never reached the registry. A green exit code is
      # not evidence that a release happened — only the registry is. Poll it and
      # fail if the version does not show up, so "silently did nothing" can never
      # masquerade as "released".
      - name: Verify the published version is actually live
        if: steps.root_publish_status.outputs.state == 'absent'
        env:
          VERSION: ${{ steps.root_publish_status.outputs.version }}
        run: |
          for attempt in $(seq 1 30); do
            if npm view "@jshookmcp/jshook@$VERSION" version >/dev/null 2>&1; then
              echo "@jshookmcp/jshook@$VERSION is live on the registry."
              exit 0
            fi
            echo "Waiting for @jshookmcp/jshook@$VERSION to appear on the registry (${attempt}/30)"
            sleep 10
          done
          echo "::error title=Publish did not go live::npm publish reported success, but @jshookmcp/jshook@$VERSION never appeared on the registry. Two likely causes, in order of probability. (1) It was STAGED, not published: the trusted publisher may be configured for 'npm stage publish' only, or the package setting differs from what you expect. Check the Staged Packages tab on npmjs.com, then clear or approve it — 'npm stage list @jshookmcp/jshook', then 'npm stage approve' or 'npm stage reject <stage-id>'. (2) The OIDC exchange silently fell back to a static token: verify the trusted publisher's 'Allowed actions' includes direct publishing, and that its first-publish validation window (2 days from creation) has not expired. Caveat learned the hard way: 'npm stage list' can print an empty list even when a version is staged, so always check the Staged Packages tab as well."
          exit 1

  publish-extension-sdk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          scope: '@jshookmcp'
          package-manager-cache: false

      # Node 22 ships npm 10.x, and npm 10 cannot perform the registry-side OIDC
      # exchange for Trusted Publishing (needs >= 11.5.1). It silently falls
      # back to the static token and the upload lands in the staging area with
      # exit 0. Upgrade the CLI, NOT the Node major: the requirement is
      # npm >= 11.5.1 on Node >= 22.14.0 — Node 24 is not required.
      # npm@12 also covers `npm stage` (>= 11.15.0) and OIDC dist-tag
      # management (>= 12.2.0), so one pin satisfies every floor.
      - name: Upgrade npm CLI
        run: |
          npm install -g npm@12
          NPM_VERSION="$(npm --version)"
          echo "npm CLI in use: $NPM_VERSION"
          # The version compare lives in awk rather than in a single-quoted
          # node -e program on purpose: shellcheck reports SC2016 for backticks
          # inside single quotes, and actionlint fails the Repo Hygiene job on
          # any shellcheck finding. The awk program below contains neither $ nor
          # a backtick, so there is nothing for shellcheck to misread.
          if ! awk -v v="$NPM_VERSION" 'BEGIN { split(v, a, "."); ok = (a[1] > 11) || (a[1] == 11 && a[2] >= 21); exit(ok ? 0 : 1) }'; then
            echo "::error title=npm CLI below the floor::npm $NPM_VERSION is below the floor this workflow relies on (>= 11.21.0). Registry OIDC needs >= 11.5.1, npm stage needs >= 11.15.0, and OIDC dist-tag management needs >= 11.21.0. A publish from this runner would fall back to a static token and be silently staged instead of released. The npm install -g npm@12 above did not take effect - check that it succeeded."
            exit 1
          fi
          # The OIDC environment is what npm >= 11.5.1 looks for. If it is
          # missing, `id-token: write` was dropped from the workflow permissions
          # and the publish would fall back to a static token (or die ENEEDAUTH).
          # Asserting it here turns a silent-staging failure that only surfaces
          # after the 5-minute registry poll into an immediate, self-explaining
          # one.
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error title=OIDC environment missing::ACTIONS_ID_TOKEN_REQUEST_URL is not set, so npm cannot mint an OIDC token. Check that the workflow-level 'permissions: id-token: write' block is still present."
            exit 1
          fi
          echo "OIDC request URL present; npm can attempt the Trusted Publisher exchange."

      - name: Enable Corepack pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate registry index
        run: node scripts/generate-domains-index.mjs

      - name: Verify and build SDK
        run: |
          pnpm -C packages/extension-sdk typecheck
          pnpm -C packages/extension-sdk build

      - name: Check SDK package publish status
        id: sdk_publish_status
        run: |
          SDK_VERSION="$(node -p "JSON.parse(require('node:fs').readFileSync('packages/extension-sdk/package.json', 'utf8')).version")"
          echo "version=$SDK_VERSION" >> "$GITHUB_OUTPUT"

          # Same three-state check as the root package, and the same caveat:
          # the stage listing is a HINT, not a verdict. See the root job for the
          # full rationale — including why an empty `npm stage list` is NOT
          # proof that nothing is staged, why its behaviour under OIDC is
          # unverified, and why the publish attempt is the real detector.
          if npm view "@jshookmcp/extension-sdk@$SDK_VERSION" version >/dev/null 2>&1; then
            echo "state=published" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          STAGED="$(npm stage list "@jshookmcp/extension-sdk" --json 2>"$RUNNER_TEMP/stage-list-sdk.err")" || {
            echo "::warning title=Staged-state check inconclusive::'npm stage list' failed, so this workflow cannot tell whether @jshookmcp/extension-sdk@$SDK_VERSION is already staged. Continuing anyway — the publish attempt below is the authoritative detector. Output was:"
            cat "$RUNNER_TEMP/stage-list-sdk.err"
            STAGED=""
          }
          if [ -n "$STAGED" ] && printf '%s' "$STAGED" | grep -qF "$SDK_VERSION"; then
            echo "state=staged" >> "$GITHUB_OUTPUT"
          else
            echo "state=absent" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail loudly on an unapproved staged SDK version
        if: steps.sdk_publish_status.outputs.state == 'staged'
        env:
          VERSION: ${{ steps.sdk_publish_status.outputs.version }}
        run: |
          echo "::error title=Staged version awaiting approval::@jshookmcp/extension-sdk@$VERSION is already in the npm staging area. It will never go live until a maintainer approves it with 2FA. Publishing again returns E409."
          STAGE_LIST="$(npm stage list "@jshookmcp/extension-sdk" 2>&1)"
          echo "$STAGE_LIST"
          {
            echo "### @jshookmcp/extension-sdk@$VERSION is staged, not published"
            echo
            echo "Approve it, then re-run this workflow:"
            echo
            echo '```bash'
            echo "npm stage approve <stage-id>"
            echo '```'
            echo
            echo "Or approve on npmjs.com -> the package page -> **Staged Packages** tab."
            echo
            echo "Staged versions visible to this workflow's credential:"
            echo
            echo '```'
            echo "$STAGE_LIST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Pack SDK package
        if: steps.sdk_publish_status.outputs.state == 'absent'
        run: |
          rm -rf .release-artifacts-sdk
          mkdir -p .release-artifacts-sdk
          pnpm -C packages/extension-sdk pack --pack-destination ../../.release-artifacts-sdk

      - name: Publish extension SDK
        if: steps.sdk_publish_status.outputs.state == 'absent'
        run: |
          SDK_TARBALL="$(find .release-artifacts-sdk -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$SDK_TARBALL"
          # `--provenance` enables npm SLSA Build L1 attestation via Sigstore
          # Fulcio. Requires `id-token: write` (set at workflow level above).
          # AUTH is OIDC — no NODE_AUTH_TOKEN is set on this step. See the root
          # job's publish step for the full rationale.
          LOG="$RUNNER_TEMP/npm-publish-sdk.log"
          set +e
          npm publish "$SDK_TARBALL" --provenance --access public 2>&1 | tee "$LOG"
          PUBLISH_STATUS="${PIPESTATUS[0]}"
          set -e
          if [ "$PUBLISH_STATUS" -ne 0 ]; then
            if grep -qF 'previously staged version' "$LOG"; then
              echo "::error title=Staged version awaiting approval::Publish was rejected because @jshookmcp/extension-sdk@${{ steps.sdk_publish_status.outputs.version }} already exists in the npm staging area. A maintainer must clear or approve it with 2FA (npm stage list @jshookmcp/extension-sdk, then npm stage approve or reject <stage-id>, or the Staged Packages tab on npmjs.com) before this version can go live. Note that 'npm stage list' can report an empty staging area even when this E409 is returned — trust the E409, not the listing."
            fi
          fi
          exit "$PUBLISH_STATUS"

      # See the root job for why this exists: a publish can exit 0 and still
      # never reach the registry.
      - name: Verify the published SDK version is actually live
        if: steps.sdk_publish_status.outputs.state == 'absent'
        env:
          VERSION: ${{ steps.sdk_publish_status.outputs.version }}
        run: |
          for attempt in $(seq 1 30); do
            if npm view "@jshookmcp/extension-sdk@$VERSION" version >/dev/null 2>&1; then
              echo "@jshookmcp/extension-sdk@$VERSION is live on the registry."
              exit 0
            fi
